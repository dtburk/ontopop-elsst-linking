<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OntoPop ↔ ELSST — match review</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --line:#d6d9de; --ink:#1f2430; --mut:#6b7280;
          --accent:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
         color:var(--ink); background:var(--bg); }
  header { position:sticky; top:0; z-index:10; background:var(--card);
           border-bottom:1px solid var(--line); padding:10px 18px;
           display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:700; }
  .bar { flex:1; min-width:160px; height:10px; background:#e5e7eb;
         border-radius:5px; overflow:hidden; }
  .bar > div { height:100%; background:var(--accent); width:0; }
  button, select { font:inherit; padding:5px 10px; border:1px solid var(--line);
                   background:var(--card); border-radius:6px; cursor:pointer; }
  button:hover { background:#eef1f6; }
  .wrap { max-width:920px; margin:18px auto; padding:0 18px; }
  .term { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px 18px; margin-bottom:14px; }
  .code { color:var(--mut); font-weight:600; font-size:12px; letter-spacing:.04em; }
  .term h2 { margin:2px 0 8px; font-size:22px; }
  .field { margin:8px 0; }
  .label { font-size:11px; text-transform:uppercase; letter-spacing:.05em;
           color:var(--mut); font-weight:700; }
  .gloss { font-style:italic; }
  details > summary { cursor:pointer; color:var(--accent); font-size:12px;
                      font-weight:600; }
  .context { white-space:pre-wrap; background:#fafbfc; border:1px solid var(--line);
             border-radius:6px; padding:10px; margin-top:6px; font-size:13px; }
  .cand { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:10px; }
  .cand.none { opacity:.7; }
  .cand h3 { margin:0 0 4px; font-size:17px; }
  .cand h3 a { color:var(--accent); text-decoration:none; }
  .cand h3 a:hover { text-decoration:underline; }
  .meta { font-size:12px; color:var(--mut); margin-bottom:6px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px;
           font-size:11px; font-weight:700; }
  .b-exactMatch{background:#dcfce7;color:#166534}
  .b-closeMatch{background:#d1fae5;color:#065f46}
  .b-broadMatch{background:#dbeafe;color:#1e40af}
  .b-narrowMatch{background:#e0e7ff;color:#3730a3}
  .b-relatedMatch{background:#fef9c3;color:#854d0e}
  .b-none{background:#f3f4f6;color:#6b7280}
  .rationale { background:#fafbfc; border-left:3px solid var(--line);
               padding:6px 10px; margin:6px 0; font-size:13px; }
  .decide { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .decide button { font-size:12px; }
  .decide button.sel { background:var(--accent); color:#fff;
                       border-color:var(--accent); }
  .nav { display:flex; gap:10px; align-items:center; margin:6px 0 22px; }
  .done-tag { color:#166534; font-weight:700; }
  .empty { color:var(--mut); font-style:italic; }
  .search { position:relative; flex:0 1 320px; min-width:220px; }
  .search input { width:100%; padding:6px 10px; border:1px solid var(--line);
                  border-radius:6px; font:inherit; }
  .results { position:absolute; top:calc(100% + 4px); left:0; right:0;
             background:var(--card); border:1px solid var(--line);
             border-radius:6px; max-height:60vh; overflow-y:auto;
             box-shadow:0 4px 12px rgba(0,0,0,.08); z-index:20; }
  .result { padding:8px 10px; cursor:pointer;
            border-bottom:1px solid var(--line); }
  .result:last-child { border-bottom:none; }
  .result.sel { background:#eef1f6; }
  .hint { font-size:11px; color:var(--mut); }
  mark { background:#fef08a; padding:0 1px; border-radius:2px; }
  .postxt { font-size:12px; color:var(--mut); white-space:nowrap; }
  .section-tag { display:inline-block; background:#eef1f6; color:var(--mut);
                 padding:1px 8px; border-radius:10px; font-size:11px;
                 letter-spacing:.02em; }
  .partners { background:#eef6ff; border-left:3px solid var(--accent);
              padding:6px 10px; margin:6px 0; font-size:12px; border-radius:4px; }
  .plink { color:var(--accent); cursor:pointer; text-decoration:underline; }
  .plink:hover { background:#dbeafe; }
  .b-phase1exact { background:#dcfce7; color:#166534; }
  .b-phase1stem  { background:#fef9c3; color:#854d0e; }
</style>
</head>
<body>
<header>
  <h1>OntoPop ↔ ELSST review</h1>
  <div class="bar"><div id="prog"></div></div>
  <span id="progtxt"></span>
  <span id="postxt" class="postxt"></span>
  <select id="filter" title="Filter terms by category"></select>
  <button id="prev">◀ Prev</button>
  <div class="search">
    <input id="search" type="search" autocomplete="off"
           placeholder="Search terms or candidates… (press /)">
    <div id="results" class="results" hidden></div>
  </div>
  <button id="next">Next ▶</button>
  <button id="exportCsv">Export CSV</button>
  <button id="saveJson">Save progress</button>
  <button id="loadJson">Load progress</button>
  <input type="file" id="fileIn" accept=".json" hidden>
</header>
<div class="wrap" id="wrap"></div>

<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('review-data').textContent);
const LS = 'elsst_review_v1';
const TYPES = ['exactMatch','closeMatch','broadMatch','narrowMatch','relatedMatch','none'];
const SEP = '';

let state = load();
function load(){
  try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; }
}
function save(){ localStorage.setItem(LS, JSON.stringify(state)); }
state.decisions = state.decisions || {};   // "codeelsstId" -> match type
state.reviewed  = state.reviewed  || {};   // code -> true
state.pos       = state.pos       || 0;
state.filter    = state.filter    || 'all';

// ── Category filter ───────────────────────────────────────────────────
// Each entry: [key, label, predicate]. The two review-status predicates
// read state.reviewed, so their counts and membership stay live.
const FILTERS = [
  ['all',         'All terms',         t => true],
  ['phase4',      'gpt-4o (Phase 4)',  t => t.cat === 'phase4'],
  ['phase1exact', 'Phase 1 exact',     t => t.cat === 'phase1exact'],
  ['phase1stem',  'Phase 1 stem',      t => t.cat === 'phase1stem'],
  ['unreviewed',  'Unreviewed',        t => !state.reviewed[t.code]],
  ['reviewed',    'Reviewed',          t => !!state.reviewed[t.code]],
];
const filterFn = key => (FILTERS.find(f => f[0] === key) || FILTERS[0])[2];

// VIEW holds the DATA indices passing the current filter; navigation and
// the position indicator operate over VIEW, while state.pos stays a DATA
// index (so saved progress and partner jumps remain stable).
let VIEW = [];
function buildView(){
  const fn = filterFn(state.filter);
  VIEW = [];
  DATA.forEach((t,i)=>{ if (fn(t)) VIEW.push(i); });
}
function clampToView(){
  if (!VIEW.length) return;
  if (VIEW.indexOf(state.pos) === -1){      // snap to nearest in-view term
    let best = VIEW[VIEW.length-1];
    for (const idx of VIEW){ if (idx >= state.pos){ best = idx; break; } }
    state.pos = best;
  }
}
const filterEl = document.getElementById('filter');
filterEl.innerHTML = FILTERS.map(f=>`<option value="${f[0]}">${f[1]}</option>`).join('');
filterEl.value = state.filter;
filterEl.onchange = ()=>{ state.filter = filterEl.value; buildView(); clampToView(); save(); render(); };
function refreshFilterLabels(){
  FILTERS.forEach((f,k)=>{
    const n = DATA.reduce((a,t)=> a + (f[2](t)?1:0), 0);
    filterEl.options[k].text = `${f[1]} (${n})`;
  });
}
// Jump to a specific DATA index regardless of the active filter: if the
// target is filtered out, fall back to "All terms" so it's always shown.
function jumpTo(i){
  if (VIEW.indexOf(i) === -1){
    state.filter = 'all'; filterEl.value = 'all'; buildView();
  }
  state.pos = i; save(); render(); window.scrollTo(0,0);
}

const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const decisionOf = (code,c) =>
  state.decisions[code+SEP+c.elsst_id] ?? c.match_type;

function render(){
  buildView();
  refreshFilterLabels();
  const done = Object.keys(state.reviewed).length;
  document.getElementById('prog').style.width = (100*done/DATA.length)+'%';
  document.getElementById('progtxt').textContent = `${done} / ${DATA.length} reviewed`;
  if (!VIEW.length){
    document.getElementById('wrap').innerHTML =
      '<div class="term empty">No terms match this filter.</div>';
    document.getElementById('postxt').textContent = '· 0 / 0 in view';
    return;
  }
  clampToView();
  state.pos = Math.max(0, Math.min(state.pos, DATA.length-1));
  const t = DATA[state.pos];
  const vi = VIEW.indexOf(state.pos);
  const filtered = state.filter !== 'all';
  const reviewed = !!state.reviewed[t.code];

  // candidates: non-none first, then none in a collapsed block
  const ranked = t.candidates.map((c,i)=>({c,i}));
  const hot  = ranked.filter(x=>x.c.match_type!=='none');
  const cold = ranked.filter(x=>x.c.match_type==='none');

  const card = c => {
    const sel = decisionOf(t.code,c);
    const isP1 = (c.tier||'').startsWith('phase1');
    const srcBadge = isP1
      ? `<span class="badge ${c.tier==='phase1:exact'?'b-phase1exact':'b-phase1stem'}">${c.tier==='phase1:exact'?'Phase 1 exact':'Phase 1 stem'}</span>`
      : `gpt-4o: <span class="badge b-${c.match_type}">${c.match_type}</span>`;
    const defTxt = c.elsst_def
      ? `<div class="field"><span class="label">ELSST definition</span><div>${esc(c.elsst_def)}</div></div>`
      : `<div class="field empty">No ELSST definition — reviewer should follow the link for context.</div>`;
    const partners = (c.exact_partners && c.exact_partners.length)
      ? `<div class="partners">ℹ Also exact-matched in Phase 1 to OntoPop: ${
          c.exact_partners.map(p =>
            `<a class="plink" data-code="${esc(p.code)}">${esc(p.label)} <span class="hint">(${esc(p.code)})</span></a>`).join(', ')
        }</div>`
      : '';
    return `<div class="cand ${c.match_type==='none'?'none':''}">
      <h3><a href="${esc(c.elsst_id)}" target="_blank" rel="noopener">${esc(c.elsst_label)} ↗</a></h3>
      <div class="meta">${srcBadge}
        &nbsp;·&nbsp; JW ${c.jw_sim==null?'—':c.jw_sim.toFixed(3)}
        &nbsp;·&nbsp; cosine ${c.cos_sim==null?'—':c.cos_sim.toFixed(3)}
        &nbsp;·&nbsp; ${esc(c.provenance)}</div>
      ${partners}
      ${defTxt}
      <div class="rationale"><b>Rationale:</b> ${esc(c.rationale)}</div>
      <div class="decide" data-eid="${esc(c.elsst_id)}">
        ${TYPES.map(tp=>`<button data-v="${tp}" class="${tp===sel?'sel':''}">${tp==='none'?'reject':tp}</button>`).join('')}
      </div></div>`;
  };

  document.getElementById('wrap').innerHTML = `
    <div class="term">
      <div class="code">${esc(t.code)}${t.section?' · <span class="section-tag">'+esc(t.section)+'</span>':''}${reviewed?' · <span class="done-tag">reviewed</span>':''}</div>
      <h2>${esc(t.label)}</h2>
      <div class="field"><span class="label">OntoPop gloss (term-specific)</span>
        <div class="gloss">${esc(t.gloss)}</div></div>
      <details><summary>Show full definedInContext paragraph</summary>
        <div class="context">${esc(t.context)}</div></details>
    </div>
    <div class="nav">
      <button id="mark">${reviewed?'✓ Reviewed — click to unmark':'Mark this term reviewed'}</button>
      <span class="meta">Term ${vi+1} of ${VIEW.length}${filtered?' (filtered)':''}</span>
    </div>
    ${hot.length ? hot.map(x=>card(x.c)).join('')
                 : '<div class="cand empty">gpt-4o rated every candidate “none”. Check the rejected list below.</div>'}
    ${cold.length ? `<details><summary>Show ${cold.length} rejected (“none”) candidate(s)</summary>
        ${cold.map(x=>card(x.c)).join('')}</details>` : ''}`;

  document.querySelectorAll('.decide').forEach(d=>{
    d.querySelectorAll('button').forEach(b=>{
      b.onclick=()=>{
        state.decisions[t.code+SEP+d.dataset.eid]=b.dataset.v;
        save(); render();
      };
    });
  });
  document.getElementById('mark').onclick=()=>{
    if(reviewed) delete state.reviewed[t.code]; else state.reviewed[t.code]=true;
    save(); render();
  };
  // jump to a Phase 1 partner's review screen
  document.querySelectorAll('.plink').forEach(el=>{
    el.onclick = ()=>{
      const idx = CODE_INDEX[el.dataset.code];
      if (idx != null) jumpTo(idx);
    };
  });
  document.getElementById('postxt').textContent =
    `· position ${vi+1} / ${VIEW.length}${filtered?' (filtered)':''}`;
}

// ── Search across OntoPop labels/codes/glosses, the shared context, ────
//    and the ELSST candidate labels. Each entry stores lower-cased
//    fields once so input events stay cheap on 1.3k terms.
let INDEX = [], CODE_INDEX = {}, selResult = -1;
function buildIndex(){
  INDEX = DATA.map((t,i)=>({
    i,
    label_lc:   t.label.toLowerCase(),
    code_lc:    t.code.toLowerCase(),
    gloss_lc:   (t.gloss   || '').toLowerCase(),
    context_lc: (t.context || '').toLowerCase(),
    cands:      t.candidates.map(c=>({
                  lc: (c.elsst_label||'').toLowerCase(),
                  label: c.elsst_label }))
  }));
  CODE_INDEX = {};
  DATA.forEach((t,i)=> CODE_INDEX[t.code] = i);
}

function runSearch(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  // A digit-leading query like "113" or "113-1" is treated as a code search:
  // skip label/gloss/context hits whose noise would swamp the few real codes.
  const codeOnly = /^\d+(-\w*)?$/.test(q);
  const out = [];
  for (const e of INDEX){
    let score = 0, hint = '';
    if (codeOnly){
      if (e.code_lc === q)            { score = 100; hint = 'exact code match'; }
      else if (e.code_lc.includes(q)) { score =  90; hint = 'in code'; }
    } else if (e.label_lc === q)      { score = 100; hint = 'exact label match'; }
    else if (e.label_lc.includes(q))  { score =  80; hint = 'in label'; }
    else if (e.code_lc.includes(q))   { score =  70; hint = 'in code'; }
    else {
      const cm = e.cands.find(c => c.lc.includes(q));
      if (cm)                           { score = 60; hint = 'candidate: ' + cm.label; }
      else if (e.gloss_lc.includes(q))  { score = 40; hint = 'in term gloss'; }
      else if (e.context_lc.includes(q)){ score = 20; hint = 'in definedInContext'; }
    }
    if (score) out.push({i: e.i, score, hint});
  }
  out.sort((a,b)=> b.score-a.score || a.i-b.i);
  return out.slice(0, 30);
}

function hl(s, q){
  if (!q) return esc(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(s);
  return esc(s.slice(0,i)) + '<mark>' + esc(s.slice(i,i+q.length)) + '</mark>' + esc(s.slice(i+q.length));
}

function renderResults(items, q){
  const box = document.getElementById('results');
  if (!items.length){ box.hidden = true; box.innerHTML = ''; selResult = -1; return; }
  selResult = 0;
  box.innerHTML = items.map((r,k)=>{
    const t = DATA[r.i];
    return `<div class="result${k===0?' sel':''}" data-i="${r.i}">
      <div><b>${hl(t.label, q)}</b> <span class="hint">${esc(t.code)}</span></div>
      <div class="hint">${r.hint.startsWith('candidate: ')
        ? 'candidate: ' + hl(r.hint.slice(11), q) : esc(r.hint)}</div></div>`;
  }).join('');
  box.hidden = false;
  box.querySelectorAll('.result').forEach((el,k)=>{
    el.onclick = ()=>{ const i = +el.dataset.i; closeResults(); jumpTo(i); };
    el.onmouseenter = ()=>{
      box.querySelectorAll('.result').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); selResult = k;
    };
  });
}
function closeResults(){
  const box = document.getElementById('results');
  box.hidden = true; box.innerHTML = '';
  const s = document.getElementById('search'); s.value = ''; selResult = -1;
}

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', e => renderResults(runSearch(e.target.value), e.target.value));
searchEl.addEventListener('keydown', e => {
  const box = document.getElementById('results');
  if (e.key === 'Escape'){ closeResults(); searchEl.blur(); return; }
  if (box.hidden) return;
  const items = [...box.children];
  if (e.key === 'ArrowDown'){
    e.preventDefault();
    selResult = Math.min(selResult+1, items.length-1);
    items.forEach((x,k)=> x.classList.toggle('sel', k===selResult));
    items[selResult].scrollIntoView({block:'nearest'});
  } else if (e.key === 'ArrowUp'){
    e.preventDefault();
    selResult = Math.max(selResult-1, 0);
    items.forEach((x,k)=> x.classList.toggle('sel', k===selResult));
    items[selResult].scrollIntoView({block:'nearest'});
  } else if (e.key === 'Enter' && selResult >= 0){
    e.preventDefault();
    const i = +items[selResult].dataset.i;
    closeResults(); jumpTo(i);
  }
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search'))
    document.getElementById('results').hidden = true;
});

function go(d){
  if (!VIEW.length) return;
  let vi = VIEW.indexOf(state.pos);
  if (vi === -1){ clampToView(); vi = VIEW.indexOf(state.pos); }
  vi = Math.max(0, Math.min(vi + d, VIEW.length-1));
  state.pos = VIEW[vi];
  save(); render();
}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === '/'){ e.preventDefault(); searchEl.focus(); return; }
  if (e.key === 'ArrowRight' || e.key === 'n') go(1);
  if (e.key === 'ArrowLeft'  || e.key === 'p') go(-1);
});

function csvCell(s){
  s = s==null ? '' : String(s);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
document.getElementById('exportCsv').onclick=()=>{
  const head=['ontopop_code','ontopop_label','ontopop_id','elsst_label',
    'elsst_id','llm_match_type','llm_rationale','reviewer_decision','term_reviewed'];
  const rows=[head.join(',')];
  DATA.forEach(t=>t.candidates.forEach(c=>{
    rows.push([t.code,t.label,t.id,c.elsst_label,c.elsst_id,c.match_type,
      c.rationale,decisionOf(t.code,c),!!state.reviewed[t.code]]
      .map(csvCell).join(','));
  }));
  download('elsst_review_decisions.csv', rows.join('\n'), 'text/csv');
};
document.getElementById('saveJson').onclick=()=>
  download('elsst_review_progress.json', JSON.stringify(state), 'application/json');
document.getElementById('loadJson').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
                   state=JSON.parse(r.result);
                   state.decisions = state.decisions || {};
                   state.reviewed  = state.reviewed  || {};
                   state.pos       = state.pos       || 0;
                   state.filter    = state.filter    || 'all';
                   filterEl.value  = state.filter;
                   save(); buildIndex(); render();
                 } catch(err){ alert('Could not read progress file.'); } };
  r.readAsText(f);
};
function download(name,text,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

buildIndex();
render();
</script>
</body>
</html>
